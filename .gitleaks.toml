# CI secret scan config (.github/workflows/security.yml). Extends
# gitleaks' own default ruleset rather than replacing it -- see
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
# for what "default" actually checks.
#
# Every allowlist entry must carry at least one real check: an empty one
# (regexes = []) fails gitleaks' own config validation ("[[allowlists]]
# must contain at least one check"), breaking secret-scan on every push/PR.
# Keep entries narrow -- a line pattern for a known non-secret shape, never
# a whole-path exclusion.
[extend]
useDefault = true

# Sentry alert tags (`alert_key: "s3-put-failed"`) are alert names, not
# credentials, but generic-api-key reads "<something>_key: <token>" as one.
[[allowlists]]
description = "Sentry alert_key tag literals"
regexTarget = "line"
regexes = ['''alert_key:\s*"[a-z0-9-]+"''']

[[allowlists]]
description = "SQL migration filenames listed in test fixtures"
regexTarget = "match"
regexes = ['''\d{3}_[a-z0-9_]*key[a-z0-9_]*\.sql",\s*"\d{3}_[a-z0-9_]+\.sql"''']
